name: Production smoke

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: Optional HTTPS deployment origin; defaults to the MILO_PRODUCTION_URL repository variable
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  public-surface:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.MILO_PRODUCTION_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MILO_PRODUCTION_URL: ${{ inputs.url || vars.MILO_PRODUCTION_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Use pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check public production surface
        run: node scripts/smoke-production.mjs
