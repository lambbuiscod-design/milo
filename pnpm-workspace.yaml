packages:
  - apps/*
  - packages/*

nodeLinker: hoisted

strictDepBuilds: true

allowBuilds:
  '@openrouter/sdk': true
  better-sqlite3: false
  electron: true
  electron-winstaller: true
  'esbuild@0.28.2': true
  sharp: true
  tesseract.js: false
  unrs-resolver: true
overrides:
  '@electron/packager>extract-zip': 'npm:@electron-internal/extract-zip@1.0.5'
  'external-editor>tmp': 0.2.7
  nanoid: 3.3.18
  postcss: 8.5.25
  sharp: 0.35.5
  source-map-js: 1.2.2
  'brace-expansion@1': 1.1.21
  'brace-expansion@2': 2.1.7
  'brace-expansion@5': 5.0.12
  'fast-uri@3': 3.1.9
  'ip-address@10': 10.7.4
  'js-yaml@4': 4.3.2
  # These callers use the named minimatch function supported by v11. Keep
  # legacy function-only minimatch consumers on their supported patched majors.
  '@electron/universal>minimatch': 11.0.1
  '@typescript-eslint/typescript-estree>minimatch': 11.0.1
  'undici@7': 7.30.1
  'undici@8': 8.12.2
  # The desktop build, React plugin and Vitest all support Vite 7. A single
  # patched version avoids range overrides rewriting their peers to Vite 8.
  vite: 7.3.7
  tar: 7.5.21
  zod: 4.6.6
